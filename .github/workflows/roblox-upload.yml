name: roblox-upload
# Uploads BGM, the sound-effect atlas and the Blender models to Roblox (Open Cloud), writes the asset IDs into
# game/src/shared/AssetIds.lua, rebuilds game/SplashFront.rbxlx and commits. Runs by itself after a BGM job.
# Needs repo secrets ROBLOX_API_KEY (Assets API read+write) and ROBLOX_CREATOR (user:<your user id> or group:<group id>).
on:
  workflow_dispatch:
    inputs:
      what: {description: "audio, models, images or all", required: false, default: "all"}
  push:
    branches: [main]
    paths: ["assets/sfx/*.ogg", "assets/models/*.fbx", "assets/textures/*.png", "assets/icons/*.png"]

permissions:
  contents: write

concurrency: {group: roblox-upload, cancel-in-progress: false}

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_CREATOR: ${{ secrets.ROBLOX_CREATOR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Upload to Roblox
        run: |
          [ -n "$ROBLOX_API_KEY" ] || { echo "::warning::Add repo secrets ROBLOX_API_KEY and ROBLOX_CREATOR to upload. Skipped."; exit 0; }
          pip install -q requests
          python tools/roblox_upload.py ${{ github.event.inputs.what || 'all' }}
      - name: Write AssetIds.lua and rebuild the place file
        run: |
          python tools/write_asset_ids.py
          python tools/build_rbxlx.py game game/SplashFront.rbxlx
      - name: Commit
        run: |
          git config user.name "splashfront-bot"; git config user.email "bot@users.noreply.github.com"
          git add assets/roblox_ids.json game/src/shared/AssetIds.lua game/SplashFront.rbxlx 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Roblox asset IDs updated [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
